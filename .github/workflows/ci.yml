name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Start server (background)
        run: |
          nohup node server.js > server.log 2>&1 &
          # give server time to start
          sleep 3

      - name: Smoke test
        run: |
          # fail if not reachable
          curl -sSfI http://localhost:3000 | head -n 1

      - name: Show server log on failure
        if: failure()
        run: tail -n 200 server.log
